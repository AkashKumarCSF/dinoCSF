experiment:
  name: csf_probe

dataset:
  name: CSF

  data_root: "/home/adminuser/backup/Neuropathological_Data/projects/Akash/CSF_classification/raw_data/zenodo/"
  split_json: "data/split_file.json"
  ods_file: "data/supplementary_table_73.ods"

model:
  backbone: "dinov2"

  dinov2:
    name: "dinov2_vitb14"
    embedding_dim: 768

  mae:
    checkpoint: "/path/to/mae_pretrained.pth"
    embedding_dim: 768

training:
  batch_size: 128
  lr: 0.001
  epochs: 100
  weight_decay: 0.0001

system:
  ddp: true
  num_workers: 4

output:
  checkpoint_dir: "checkpoints"
  tensorboard_dir: "tensorboard_logs"

data:
  img_size: 224

classes:
  num_classes: 15

  names:
    - Artifizielle Zelle
    - Erythrophage
    - Erythrozyt
    - Hämatoidin
    - Hämosiderophage
    - Kernschatten
    - Lymphozyt
    - Mitose
    - Monozyt
    - Plasmazelle
    - Tumor
    - aktivierter Lymphozyt
    - aktivierter Monozyt
    - eosinophiler Granulozyt
    - neutrophiler Granulozyt